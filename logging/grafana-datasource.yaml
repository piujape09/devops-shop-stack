# ConfigMap auto-discovered by the Grafana sidecar (label grafana_datasource=1)
# from kube-prometheus-stack. Adds Loki as a datasource so you can query logs
# directly in Grafana → Explore.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        isDefault: false
        editable: true
