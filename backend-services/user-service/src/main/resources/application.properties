server.port=${SERVER_PORT:5002}
spring.application.name=user-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:users;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT - secret MUST be supplied via env in any non-dev environment.
security.jwt.secret=${JWT_SECRET:change-me-32-bytes-min-change-me-32-bytes-min}
security.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
security.jwt.issuer=${JWT_ISSUER:shopk8s}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
