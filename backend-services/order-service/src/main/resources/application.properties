server.port=${SERVER_PORT:5003}
spring.application.name=order-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Service discovery via DNS (k8s Service name / docker-compose service name).
services.product.base-url=${PRODUCT_SERVICE_URL:http://product-service:5001}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
