server:
  port: ${SERVER_PORT:5000}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders: "Authorization"
      routes:
        # ----- Public routes (no JWT) -----
        - id: auth
          uri: ${USER_SERVICE_URL:http://user-service:5002}
          predicates: [ Path=/auth/** ]

        - id: products-read
          uri: ${PRODUCT_SERVICE_URL:http://product-service:5001}
          predicates:
            - Path=/products/**
            - Method=GET

        # ----- Protected routes (JWT required) -----
        - id: products-write
          uri: ${PRODUCT_SERVICE_URL:http://product-service:5001}
          predicates:
            - Path=/products/**
            - Method=POST,PUT,DELETE
          filters: [ JwtAuth ]

        - id: users
          uri: ${USER_SERVICE_URL:http://user-service:5002}
          predicates: [ Path=/users/** ]
          filters: [ JwtAuth ]

        - id: orders
          uri: ${ORDER_SERVICE_URL:http://order-service:5003}
          predicates: [ Path=/orders/** ]
          filters: [ JwtAuth ]

        - id: payments
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:5004}
          predicates: [ Path=/payments/** ]
          filters: [ JwtAuth ]

security:
  jwt:
    secret: ${JWT_SECRET:change-me-32-bytes-min-change-me-32-bytes-min}
    issuer: ${JWT_ISSUER:shopk8s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
