{{- /* Emit a ServiceMonitor per service whose prometheus.enabled is true.
       Requires the Prometheus Operator CRDs (installed by kube-prometheus-stack). */ -}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.prometheus $svc.prometheus.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    release: monitoring   # must match kube-prometheus-stack release name
    app: {{ $name }}
spec:
  selector:
    matchLabels:
      app: {{ $name }}
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  endpoints:
    - port: http
      path: {{ $svc.prometheus.path | default "/actuator/prometheus" }}
      interval: 15s
      scrapeTimeout: 10s
{{- end }}
{{- end }}
