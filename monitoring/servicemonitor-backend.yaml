apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: shop-dev
  labels:
    release: monitoring   # must match kube-prometheus-stack release name
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - shop-dev
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
---
# Example PrometheusRule: alert when backend p95 latency > 1s for 5m
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backend-rules
  namespace: shop-dev
  labels:
    release: monitoring
spec:
  groups:
    - name: backend.rules
      rules:
        - alert: BackendHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{job="backend"}[5m]))
            ) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Backend p95 latency > 1s"
            description: "Investigate slow endpoints; latency has been > 1s for 5m."
        - alert: BackendErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{job="backend",status=~"5.."}[5m]))
              /
            sum(rate(http_server_requests_seconds_count{job="backend"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Backend 5xx error rate > 5%"
